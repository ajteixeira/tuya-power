services:
  tuya-power:
    build: .
    image: ${TUYA_IMAGE:-ghcr.io/ajteixeira/tuya-power:latest}
    container_name: tuya-power
    restart: unless-stopped
    # Só acessível pelo lighttpd (/power); para acesso direto na rede use "${PORT:-8002}:8080"
    ports:
      - "127.0.0.1:${PORT:-8002}:8080"
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      DB_PATH: /app/data/tuya.db
      # Configuração (credenciais, WEB_PASSWORD, SYNC_*...): fica na pasta de dados, ao lado da base de
      # dados. Para a alterar: editar /mnt/storage1/data/tuya-power/.env e `docker restart tuya-power`.
      ENV_FILE: /app/data/.env
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - /mnt/storage1/data/tuya-power:/app/data   # base de dados persistente (fora do contentor)
