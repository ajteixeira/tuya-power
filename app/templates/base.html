<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Tuya Power{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
:root{--bg:#f6f7f9;--fg:#1c1e21;--card:#fff;--mut:#6b7280;--acc:#2563eb;--ok:#15803d;--err:#b91c1c;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--fg:#e5e7eb;--card:#1b1e26;--mut:#9ca3af;--acc:#60a5fa;--ok:#4ade80;--err:#f87171;--bd:#2d313c}}
body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
header a{color:var(--fg);text-decoration:none;font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
a{color:var(--acc)} .mut{color:var(--mut)} .ok{color:var(--ok)} .err{color:var(--err)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--err);margin-right:6px}.dot.on{background:var(--ok)}
button,select,input{font:inherit;padding:5px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg)}
button{cursor:pointer;background:var(--acc);color:#fff;border-color:var(--acc)}
table{width:100%;border-collapse:collapse}td,th{padding:4px 8px;border-bottom:1px solid var(--bd);text-align:left}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}.kv b{display:block;font-size:20px}
form.inline{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
</style></head><body>
<header><a href="/">⚡ Tuya Power</a></header>
<main>{% block content %}{% endblock %}</main></body></html>
