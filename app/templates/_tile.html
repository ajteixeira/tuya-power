<div class="mini">
{% if sw is not none %}<span class="sw {{ 'on' if sw else 'off' }}" title="{{ 'Ligado' if sw else 'Desligado' }}"><svg viewBox="0 0 44 24" width="44" height="24"><rect x="1" y="1" width="42" height="22" rx="11" fill="currentColor"/><circle cx="{{ 32 if sw else 12 }}" cy="12" r="8" fill="#fff"/></svg></span><b>{{ 'Ligado' if sw else 'Desligado' }}</b>{% endif %}
{% if power %}<span class="mut">⚡ {{ power }}</span>{% endif %}
{% if temp %}<span>🌡 <b>{{ temp }}</b></span>{% endif %}
{% if hum %}<span>💧 <b>{{ hum }}</b></span>{% endif %}
</div>
