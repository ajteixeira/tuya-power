<div class="tile">
{% if sw is not none %}<span class="sw {{ 'on' if sw else 'off' }}">⏻ {{ 'Ligado' if sw else 'Desligado' }}</span>{% endif %}
{% if power %}<span class="mut">⚡ {{ power }}</span>{% endif %}
{% if temp %}<span>🌡 <b>{{ temp }}</b></span>{% endif %}
{% if hum %}<span>💧 <b>{{ hum }}</b></span>{% endif %}
</div>
