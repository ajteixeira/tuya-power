# Tuya Power: proxy para o contentor na porta 8002
# Acesso: http://<servidor>/power
#
# Instalação:
#   sudo cp deploy/94-tuya-power.conf /etc/lighttpd/conf-available/
#   sudo lighty-enable-mod tuya-power
#   sudo systemctl reload lighttpd

$HTTP["url"] =~ "^/power($|/)" {
    proxy.server = (
        "" => (
            (
                "host" => "127.0.0.1",
                "port" => 8002
            )
        )
    )
    proxy.forwarded = ( "for" => 1, "proto" => 1, "host" => 1 )
    setenv.add-request-header = ( "X-Forwarded-Prefix" => "/power" )
}
